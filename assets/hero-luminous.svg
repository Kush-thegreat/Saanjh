<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 700">
<defs>
 <linearGradient id="night" x2=".7" y2="1"><stop stop-color="#e9bed4"/><stop offset="1" stop-color="#c9b9e2"/></linearGradient>
 <radialGradient id="alcove"><stop stop-color="#f9d8b9"/><stop offset=".58" stop-color="#ecb9b2"/><stop offset="1" stop-color="#c5a3c7"/></radialGradient>
 <linearGradient id="brass"><stop stop-color="#8b5e29"/><stop offset=".24" stop-color="#e2b66c"/><stop offset=".5" stop-color="#fff0ba"/><stop offset=".74" stop-color="#b88843"/><stop offset="1" stop-color="#725026"/></linearGradient>
 <linearGradient id="glass"><stop stop-color="#66508c"/><stop offset=".18" stop-color="#a17ac5"/><stop offset=".45" stop-color="#e0bdee"/><stop offset=".73" stop-color="#bf8bd2"/><stop offset="1" stop-color="#77518c"/></linearGradient>
 <linearGradient id="darkglass"><stop stop-color="#226765"/><stop offset=".42" stop-color="#76bcb0"/><stop offset=".7" stop-color="#43978f"/><stop offset="1" stop-color="#1e5d62"/></linearGradient>
 <linearGradient id="wax" x2="0" y2="1"><stop stop-color="#fff3d2"/><stop offset="1" stop-color="#c99d67"/></linearGradient>
 <linearGradient id="flame" x2="0" y2="1"><stop stop-color="#c65e16"/><stop offset=".45" stop-color="#f5a52d"/><stop offset="1" stop-color="#ffe496"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#ffc364" stop-opacity=".5"/><stop offset=".45" stop-color="#e9a24c" stop-opacity=".12"/><stop offset="1" stop-color="#f9bc65" stop-opacity="0"/></radialGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#e4bbad"/><stop offset="1" stop-color="#b69bc4"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
 <filter id="tiny"><feGaussianBlur stdDeviation="3"/></filter>
 <linearGradient id="sheen"><stop stop-color="#fff7df" stop-opacity="0"/><stop offset=".5" stop-color="#fff7df" stop-opacity=".24"/><stop offset="1" stop-color="#fff7df" stop-opacity="0"/></linearGradient>
 <pattern id="wall-detail" width="44" height="44" patternUnits="userSpaceOnUse"><path d="m22 14 1.5 6.5L30 22l-6.5 1.5L22 30l-1.5-6.5L14 22l6.5-1.5Z" fill="#ffffff" opacity=".08"/></pattern>
 <clipPath id="jar-clip"><path d="M164 351h211v186q0 35-106 35t-105-35Z"/></clipPath>
 <style>
 .flame{transform-box:fill-box;transform-origin:50% 100%}.glow{transform-box:fill-box;transform-origin:center}.spark{opacity:.65;transform-box:fill-box;transform-origin:center}.reflection{opacity:.2}.leaf{transform-origin:555px 540px}.back-flame{animation-delay:-.8s!important}
 @media(prefers-reduced-motion:no-preference){.flame{animation:flicker 1.9s ease-in-out infinite}.glow{animation:breathe 3.7s ease-in-out infinite}.spark{animation:rise 6s ease-out infinite;opacity:0}.s2{animation-delay:-2s;animation-duration:7s}.s3{animation-delay:-4.5s;animation-duration:8s}.s4{animation-delay:-1s;animation-duration:5.5s}.s5{animation-delay:-3.5s;animation-duration:6.8s}.reflection{animation:reflections 3.7s ease-in-out infinite}.leaf{animation:sway 8s ease-in-out infinite}.orbit{animation:twinkle 5s ease-in-out infinite}}
 @keyframes flicker{0%,100%{transform:rotate(-3deg) scale(.98,1)}18%{transform:rotate(2deg) scale(1.04,.94)}43%{transform:rotate(-2deg) scale(.94,1.07)}68%{transform:rotate(4deg) scale(1.03,.98)}84%{transform:rotate(0) scale(.97,1.03)}}
 @keyframes breathe{0%,100%{opacity:.65;transform:scale(.94)}55%{opacity:1;transform:scale(1.08)}}
 @keyframes rise{0%{opacity:0;transform:translate(0,20px) scale(.4)}20%{opacity:.9}65%{opacity:.4}100%{opacity:0;transform:translate(12px,-65px) scale(.2)}}
 @keyframes reflections{0%,100%{opacity:.14}50%{opacity:.32}}
 @keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2deg)}}
 @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.8}}
 @media(prefers-reduced-motion:no-preference){.glass-sheen{animation:glass-light 9s ease-in-out infinite}.table-light{animation:reflections 4.5s ease-in-out infinite}}
 @keyframes glass-light{0%,100%{transform:translateX(-35px);opacity:.2}50%{transform:translateX(30px);opacity:.65}}
 </style>
</defs>
